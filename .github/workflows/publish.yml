name: Publish

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Check tag version
        run: |
          node -e 'const p = require("./package.json"); if (process.env.GITHUB_REF_NAME.replace(/^v/, "") !== p.version) throw new Error("Tag and package versions must match");'
      - name: Publish with provenance
        # prepublishOnly runs the lint, build, and test checks before publishing.
        # Configure npm Trusted Publishing for this workflow, or set NPM_TOKEN.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
